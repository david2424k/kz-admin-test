<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Админ-панель | KZ Project Group</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
</head>
<body class="bg-gradient-to-br from-yellow-100 via-amber-200 to-yellow-300 min-h-screen flex flex-col items-center justify-center">
  <div class="bg-white shadow-2xl rounded-2xl p-8 max-w-3xl w-full">
    <h1 class="text-3xl font-bold text-center text-yellow-800 mb-6">KZ Project Group — Панель администратора</h1>

    <div id="loginPanel" class="text-center space-y-4">
      <p class="text-gray-700">Введите пароль для доступа:</p>
      <input id="adminPassword" type="password" class="border border-yellow-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-yellow-500 outline-none">
      <button id="loginBtn" class="bg-yellow-600 hover:bg-yellow-700 text-white font-bold py-2 px-4 rounded-lg shadow-md transition">Войти</button>
    </div>

    <div id="adminPanel" class="hidden">
      <table class="w-full border-collapse mt-6">
        <thead>
          <tr class="bg-yellow-200 text-yellow-900">
            <th class="p-3 border">Имя</th>
            <th class="p-3 border">Email</th>
            <th class="p-3 border">Сообщение</th>
          </tr>
        </thead>
        <tbody id="dataTable" class="text-gray-700"></tbody>
      </table>

      <button id="clearBtn" class="mt-6 bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-lg shadow-md transition">Очистить все заявки</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
